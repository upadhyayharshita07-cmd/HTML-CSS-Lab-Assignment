<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Task 1: Horizontal Navigation Bar -->
  <h2>Task 1: Horizontal Flex Navigation Bar</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Events</a>
    <a href="#">Contact</a>
  </nav>

  <hr>

  <!-- Task 2: Centred Cards -->
  <h2>Task 2: Centred Pricing Cards</h2>
  <div class="row">
    <div class="card">
      <h3>Starter</h3>
      <p class="price">&#8377;199</p>
    </div>
    <div class="card">
      <h3>Standard</h3>
      <p class="price">&#8377;349</p>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p class="price">&#8377;499</p>
    </div>
  </div>

  <hr>

  <!-- Task 3: Wrapping Cards -->
  <h2>Task 3: Stationery Shop (Flex-Wrap Row)</h2>
  <div class="wrapping-row">
    <div class="shop-card">
      <h3>Notebook</h3>
      <p>Price: &#8377;60</p>
    </div>
    <div class="shop-card">
      <h3>Pen</h3>
      <p>Price: &#8377;15</p>
    </div>
    <div class="shop-card">
      <h3>Bag</h3>
      <p>Price: &#8377;350</p>
    </div>
    <div class="shop-card">
      <h3>Book</h3>
      <p>Price: &#8377;120</p>
    </div>
  </div>
</body>
</html>
