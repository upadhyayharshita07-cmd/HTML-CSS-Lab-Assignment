<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign-Up Forms and Choices</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-wrapper">
    <h1>Student Sign-Up & Choices Form</h1>

    <!-- Task 1: Labelled form with name, email, password -->
    <form action="#" method="post">
      <div class="form-group">
        <label for="fullname">Full Name: *</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="useremail">Email Address: *</label>
        <input type="email" id="useremail" name="useremail" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="userpassword">Password:</label>
        <input type="password" id="userpassword" name="userpassword" placeholder="Enter password">
      </div>

      <!-- Task 2: Gender radio buttons and Course dropdown -->
      <div class="form-group">
        <label>Gender:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="Female"> Female
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Male" checked> Male
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="course">Academic Course:</label>
        <select id="course" name="course">
          <option value="BCA">BCA</option>
          <option value="B.Tech" selected>B.Tech</option>
        </select>
      </div>

      <!-- Task 3: Submit Button -->
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
